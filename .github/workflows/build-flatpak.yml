name: Build Flatpak & Deploy Repository

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/andyholmes/flatter/freedesktop:25.08
      options: --privileged
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup GPG
        if: vars.GPG_ENABLED == 'true'
        id: gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Install .NET SDK extension
        run: flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.dotnet10//25.08

      - name: Build Flatpak
        uses: andyholmes/flatter@main
        with:
          files: packaging/flatpak/org.purplepen.PurplePen.yml
          gpg-sign: ${{ steps.gpg.outputs.fingerprint || '' }}
          upload-bundles: true
          upload-pages-artifact: true
          upload-pages-includes: |
            packaging/flatpak/index.html
          flatpak-builder-args: --install-deps-from=flathub

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: flatpak
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
